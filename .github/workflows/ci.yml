# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install xdrlib3

      - name: Parse all XDR test files
        run: make test

      - name: Generate and validate Python output
        run: make test-python

      - name: Generate C output
        run: make test-c

      - name: Verify rpc/ package imports
        run: |
          python -c "
          from rpc.rpc import Client, Server, RPCError, RPCTimeout
          from rpc.rpc import FancyRPCPacker, FancyRPCUnpacker
          from rpc.rpclib import NULL_CRED, RPCFlowContol, RPCDrop
          from rpc.rpclib import RPCDeniedReply, RPCUnsuccessfulReply, RPCSuccessfulReply
          from rpc.rpc_security import CredInfo, AuthNone, AuthSys, SecError
          from rpc.rpc_security import instances, instance, klass
          print('All imports OK')
          "

      - name: Test AUTH_SYS round-trip
        run: |
          python -c "
          from rpc.rpc_security import AuthSys
          auth = AuthSys()
          cred = auth.init_cred(uid=1000, gid=1000, name=b'testhost')
          packed = auth.pack_cred(auth.make_cred(cred).body)
          unpacked = auth.unpack_cred(packed)
          assert unpacked.uid == 1000
          assert unpacked.gid == 1000
          assert unpacked.machinename == b'testhost'
          print('AUTH_SYS round-trip OK')
          "

      - name: Regenerate rpc/ and verify no drift
        run: |
          make generate-rpc
          git diff --exit-code rpc/ || (echo "ERROR: rpc/ modules out of sync with .x files" && exit 1)

      - name: Clean up
        run: make clean

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers
        run: |
          missing=0
          for f in $(git ls-files); do
            case "$f" in LICENSE) continue ;; esac
            # Skip generated files (they carry the source .x file's license, not ours)
            if grep -q "DO NOT EDIT - generated by xdr_parser.py" "$f" 2>/dev/null; then continue; fi
            if [ -f "$f" ] && ! grep -q "SPDX-License-Identifier" "$f"; then
              echo "MISSING SPDX: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing file(s) missing SPDX headers"
            exit 1
          fi
          echo "All files have SPDX headers"
