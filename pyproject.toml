# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-xdr"
version = "0.1.0"
description = "XDR parser, code generator, and ONC RPC library for Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.6"
authors = [
    {name = "Tom Haynes", email = "loghyr@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Networking",
]
dependencies = [
    "xdrlib3",
]

[project.optional-dependencies]
gss = ["gssapi"]

[project.scripts]
xdr-parser = "xdr_parser:main"

[project.urls]
Homepage = "https://github.com/loghyr/reply"

[tool.setuptools]
py-modules = ["xdr_parser"]

[tool.setuptools.packages.find]
include = ["rpc*"]
